# ----------------------------------------------------------------------
# electron_gun validation case (holed-anode RZ gun)
#
# 1_negative_cathode plus ONE new element: a grounded plate (the "anode")
# across the midplane with a hole on axis.  The -100 V cathode at z_min
# emits a prescribed beam; whatever clears the hole drifts to the
# collector at z_max.  Three scenarios demonstrate aperture transmission
# vs space charge:
#
#   A  low current, small hole  -> ~all current passes (matches case 1)
#   B  20x current, small hole  -> radial space-charge blowup near the
#                                  cathode; the hole clips the beam
#   C  20x current, big hole    -> transmission restored
#
# Child-Langmuir for the 1.9 mm accel gap at 100 V over the 0.5 mm spot:
# I_CL = 507 uA.  A = 2.0% of CL (stiff beam), B/C = 39% (space charge
# matters, but no virtual cathode -- the loss channel is RADIAL).
#
# NOTE on floats: PyYAML implements YAML 1.1 -- write floats with a
# decimal point AND a signed exponent (5.0e-4, not 5e-4 or 1e19).
# ----------------------------------------------------------------------
case_name: electron_gun

geometry:
  r_max: 2.0e-3          # radial extent [m]
  z_min: -2.0e-3         # left boundary  [m] -- the cathode plane
  z_max: 2.0e-3          # right boundary [m] -- the collector plane
  n_r: 40                # radial cells  (dr = 0.05 mm)
  n_z: 80                # axial cells   (dz = 0.05 mm)

electrodes:
  v_cathode: -100.0      # left  (z_min) Dirichlet boundary [V] -- the emitting plate
  v_collector: 0.0       # right (z_max) Dirichlet boundary [V]
  v_anode: 0.0           # holed mid plate [V]; grounded -> field-free drift region

anode:                   # holed plate, modelled as an embedded boundary:
                         # conductor where z_front < z < z_front+thickness AND r > hole
  z_front: -1.0e-4       # upstream face [m] -> accel gap d = z_front - z_min = 1.9 mm
  thickness: 2.0e-4      # 4 axial cells

emission:                # disc source one cell inside the cathode, firing +z
  radius: 5.0e-4         # source spot r < radius [m] (10 radial cells)
  u_th: 7.0e-4           # cold launch: normalized rms momentum (gamma*beta)

scenarios:               # the demonstration ladder; each runs in its own WarpX
                         # process -> outputs/diags_<name>/ (a scenario with a
                         # config_used.yaml snapshot is considered done and skipped)
  - name: A_low_current_small_hole
    current: 1.0e-5      # same 10 uA as 1_negative_cathode (2.0% of I_CL)
    hole_radius: 7.0e-4  # 1.4x the emission spot
  - name: B_high_current_small_hole
    current: 2.0e-4      # 20x current: 39% of I_CL -> strong radial space charge
    hole_radius: 7.0e-4
  - name: C_high_current_big_hole
    current: 2.0e-4
    hole_radius: 1.4e-3  # 2x scenario B's hole

numerics:
  time_step: 1.5e-12     # [s]  (v_max*dt ~ 0.18 dz)
  max_steps: 4000        # 6.0 ns total (transit ~1.3 ns; steady well before end)
  beam_ppc: 128          # emission macroparticles per source cell per step
  random_seed: 42

diagnostics:
  field_period: 80       # phi/rho + particle dumps every N steps (50 frames)
  reduced_period: 20     # ParticleNumber / ParticleEnergy cadence
  scrape_period: 80      # boundary-scraping dump cadence
  ke_max_ev: 120.0       # energy-axis / colour-scale ceiling for plots & video [eV]

validation:              # gate tolerances (evaluated by the analyze script)
  a_collector_min_frac: 0.99   # A: >= 99% of emitted reaches the collector
  a_anode_max_frac: 0.01       # A: <= 1% intercepted by the plate
  b_drop_min_frac: 0.05        # B: collector fraction at least 5 pp below A's
  b_anode_min_frac: 0.02       # B: the loss shows up ON the plate (not reflected)
  c_collector_min_frac: 0.95   # C: widening the hole restores transmission
  ke_tol_ev: 1.5               # collector KE vs energy conservation from emit plane
  closure_pct_max: 0.1         # particle-budget closure, every scenario [%]

compute:
  # AMReX pre-allocates ~3/4 of TOTAL GPU memory by default; cap the arena so
  # this small deck coexists with other GPU users (it peaks well under 1 GB).
  gpu_arena_bytes: 1000000000

paths:                   # relative to this case directory
  diags_base: outputs    # per-scenario diagnostics: outputs/diags_<name>/
  results: results

video:
  fps: 10.0
