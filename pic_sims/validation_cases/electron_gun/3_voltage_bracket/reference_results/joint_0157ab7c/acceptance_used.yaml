# ----------------------------------------------------------------------
# Acceptance policy for emitter.voltage_bracket (the voltage-axis gun).
#
# v2 NOTE — a v1 mechanism gate was REFUTED by the committed cohort and
# is re-gated here, following the emitter.holed_anode precedent (its
# first cold-beam gate FAILED, taught the beam's transverse temperature,
# and was re-gated with the lesson documented).  v1 required scenario C
# (92.4 V at 133.5% of the planar Child-Langmuir scale) to LOSE >= 3 pp
# of transmission to space-charge current limiting.  Measured
# (analysis 20260807T204601Z_8f54b654, all accounting gates PASS):
# C transmitted 0.9999 — no limiting at all.  The planar I_CL over the
# emission spot is a conservative scale for this geometry (spot 0.5 mm
# vs gap 1.9 mm, radial expansion room, 1.4 mm hole): the transmission
# loss holed_anode B measured at 79% of the same scale was APERTURE
# CLIPPING through the small 0.7 mm hole, not virtual-cathode limiting.
# The corrected mechanism claim, gated below: transmission is flat
# across the full bracket — voltage 92.4-300 V AND planar-scale
# fraction 0.24-1.34 — so the capstone commands cannot fail by generic
# gun optics; any throttle-curve tax must live in the capstone's own
# in-can gap and collection physics (which the capstone.ucurve_* stages
# measure directly).
#
# Scenarios A (200 V) and B (300 V) close the emitter branch's voltage
# gap (VALIDATION_GAPS.md G3): both sit at the same healthy 23.9% of the
# planar scale and must transmit identically.
#
# Energy conservation and particle-budget closure are required for every
# scenario: they certify accounting, not physics.
#
# The planar Child-Langmuir current itself is DELIBERATELY not gated
# (non-planar geometry; printed scale only -- the holed_anode precedent).
#
# Changing any tolerance requires a new policy_id; every verdict records
# this file's SHA-256.
# ----------------------------------------------------------------------
schema_version: 1
policy_id: emitter.voltage_bracket.v2
stage_id: emitter.voltage_bracket
evidence_kind: mechanism_regression

gates:
  # A -- 200 V at the anchor command.
  - id: A_collector_transmits
    required: true
    metric: A_200v_anchor_drive__collector_fraction
    comparison: at_least
    minimum: 0.96

  # B -- 300 V at the ceiling command.
  - id: B_collector_transmits
    required: true
    metric: B_300v_ceiling_drive__collector_fraction
    comparison: at_least
    minimum: 0.96

  # C -- 92.4 V past the planar scale: transmits anyway (measured 0.9999).
  - id: C_collector_transmits
    required: true
    metric: C_ucurve_overperveance__collector_fraction
    comparison: at_least
    minimum: 0.96

  # The bracket claim, voltage leg: at fixed planar-scale fraction,
  # transmission is voltage-independent across the capstone drive range.
  - id: transmission_flat_across_bracket
    required: true
    metric: transmission_spread_A_to_B
    comparison: at_most
    maximum: 0.02

  # The bracket claim, perveance leg (the v2 correction): transmission is
  # ALSO flat from 0.24 to 1.34 of the planar scale -- the scale is
  # conservative for this geometry, and a future regression that loses
  # current here would be a real defect, not "expected limiting".
  - id: C_transmission_flat_vs_A
    required: true
    metric: C_collector_drop_vs_A
    comparison: abs_within
    target: 0.0
    tolerance: 0.02

  # Per-scenario energy conservation from the emission plane (self-consistent phi).
  - id: A_collector_ke_conserved
    required: true
    metric: A_200v_anchor_drive__ke_error_eV
    comparison: abs_within
    target: 0.0
    tolerance: 1.5
  - id: B_collector_ke_conserved
    required: true
    metric: B_300v_ceiling_drive__ke_error_eV
    comparison: abs_within
    target: 0.0
    tolerance: 1.5
  - id: C_collector_ke_conserved
    required: true
    metric: C_ucurve_overperveance__ke_error_eV
    comparison: abs_within
    target: 0.0
    tolerance: 1.5

  # Per-scenario particle-budget closure.
  - id: A_budget_closure
    required: true
    metric: A_200v_anchor_drive__budget_closure_pct
    comparison: abs_within
    target: 0.0
    tolerance: 0.1
  - id: B_budget_closure
    required: true
    metric: B_300v_ceiling_drive__budget_closure_pct
    comparison: abs_within
    target: 0.0
    tolerance: 0.1
  - id: C_budget_closure
    required: true
    metric: C_ucurve_overperveance__budget_closure_pct
    comparison: abs_within
    target: 0.0
    tolerance: 0.1
