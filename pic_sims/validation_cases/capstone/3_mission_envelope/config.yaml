# ----------------------------------------------------------------------
# capstone.mission_envelope -- physics/numerics config (chipsat, two mission
# operating points).
#
# WHAT THIS STAGE CLAIMS: that the 0-D design model in design_sims/ predicts
# what the full PIC deck actually does, at two operating points chosen from a
# real year-long mission and far from the single point its constants were
# fitted at.
#
# The shared physics below is the validated capstone.floating_body deck,
# COPIED VERBATIM (deliberate duplication -- this repo has no shared physics
# framework, and a stage that imported another stage's deck could not be
# audited on its own).  Only three things differ:
#
#   run.t_end     800 ns -> 1.0 us.  Scenario B's float takes tau = 244 ns to
#                 settle (tau ~ 1/n_e, and B is a thin-plasma row), so 800 ns
#                 would measure a transient.  1 us is ~4 tau.
#   run.max_steps 160000 -> 300000.  At 300 V the CFL timestep is ~4.14 ps, so
#                 1 us needs ~242k steps; the old cap would have silently
#                 truncated the run to 660 ns.
#   plasma / cathode_offset / i_beam are PER SCENARIO (below).
#
# THE `scenarios:` AND `law_anchor:` BLOCKS ARE A PRE-REGISTRATION.  They were
# generated by design_sims/operating_point.py from the committed orbit CSV and
# committed BEFORE the runs, so the `predicted:` numbers are in git with a
# timestamp and cannot be quietly adjusted once the measurement lands.  The
# analysis recomputes them from the frozen law_anchor constants and gates the
# agreement (S__prediction_consistency), which catches any drift between this
# stage's opmodel.py and design_sims/opmodel.py.
#
# Gates live in acceptance.yaml.  PyYAML 1.1: decimal point AND signed
# exponent; helpers.py coerces every numeric leaf regardless.
# ----------------------------------------------------------------------
stage_id: capstone.mission_envelope

electrical:
  phi_body_init: 0.0       # [V] initial floating-body potential (pump start).
  t_supply: 100.0e-9       # [s] supply switch-on; before this, body and cathode are
                           #     equipotential and the can settles like a bare probe.
                           # cathode_offset is PER SCENARIO.

beam:
  t_on: 150.0e-9           # [s] gun switch-on; must be >= t_supply.
  rms_velocity: 2.6e5      # [m/s] per-axis thermal spread of the emitted beam
                           #     (~0.39 eV/axis; see 2_chipsat_thruster
                           #     VALIDATION_GAPS.md G3).
  flux_correction: 1.0     # [-] RZ over-emission divisor.
                           # i_beam is PER SCENARIO.

geometry:                  # verbatim from capstone.floating_body; all lengths [m].
  r_probe: 5.0e-3          # can outer radius.
  wall_thickness: 0.4e-3
  lid_thickness: 0.4e-3
  floor_thickness: 0.4e-3
  z_bot: -5.0e-3           # can floor bottom (also the cathode-disk bottom).
  z_top: 0.5e-3            # lid top.
  r_slit: 2.0e-3           # lid exhaust-hole radius -- the escape lever.
  r_cathode: 1.5e-3        # cathode-disk radius (the emitting electrode).
  emit_radius: 0.5e-3      # emission-spot radius; < r_cathode and < r_slit.

reservoir:                 # infinite-ionosphere recycle.  REQUIRED for the floating
                           # equilibrium (a current balance); without refill the run
                           # measures reservoir depletion, not physics.
  enabled: true
  frac: 0.7
  every: 25

domain:
  rmax: 0.030              # [m] outer radial extent.  SEE README: the night
                           #     scenario has lambda_D = 6.0 mm, so this is only
                           #     5 lambda_D and the smoke run checks containment
                           #     before the real runs commit to it.
  aspect: 1.12
  zmargin_lo: 25.0e-3
  zmargin_hi: 35.0e-3
  edge_phi_max: 1.0        # [V] live sheath-containment watchdog (warn); the same
                           #     bound is GATED in analysis from field dumps.

numerics:
  dx: 0.15e-3              # [m] cell size (dr = dz).
  dt: null                 # [s] null -> CFL-derived: 0.3*dx/(v_beam + 4*vth_e).
  ppc: 16                  # ambient macroparticles per cell per species.
  ppc_beam: 16             # beam macroparticles per surface cell per step.

run:
  t_end: 1.0e-6            # [s] see header: set by scenario B's 244 ns settle time.
  max_steps: 300000        # [-] hard cap; ~242k steps are actually needed at 300 V.
  diag_period_frac: 40     # openPMD field/particle/scrape dumps: ~this many per run.
  phi_ceiling: 100.0       # [V] choke detector: sustained phi_body above this aborts
                           #     the run as FAILED (the ionosphere cannot neutralize).
  choke_sustain: 50.0e-9

compute:
  gpu_arena_bytes: 6000000000

# --- the frozen design model -----------------------------------------------
# Constants copied from design_sims/calibration/laws.yaml at the sha below.  The
# stage NEVER imports design_sims; these values arrive only by being committed
# here.  Changing them requires a new acceptance policy version and fresh runs
# (the gated predictions would otherwise describe a model that no longer exists).
law_anchor:
  k: 3.28652
  ke_ledger: 0.806016
  f_esc: 0.984364
  beta: 0.46158
  area_m2: 0.000329867
  capacitance_F: 5.56325e-13
  anchored_to: pic_sims/validation_cases/capstone/2_chipsat_thruster/reference_results/20260801T142601Z_2f822a95/metrics.json
  metrics_sha256: 6ad62f9c3f88be87997f5f02fcfeef668a39812c0c513551663de4ee25de6cff
  laws_sha256: af4c1fef40d4c8e4e786c0ef223bad658965e4564c5eba99ee9e6bf52ab59ec4

# --- the two mission operating points --------------------------------------
# Selection rule (design_sims/operating_point.py, committed):
#   A_day_p95      the CSV row at the nearest-rank 95th percentile of drag_N.
#                  Dense dayside plasma, peak demand; the EMISSION ceiling binds.
#   B_night_worst  the row minimising the supply margin
#                  i_ceiling(row, phi_max)/i_demand(row, v_max), subject to the
#                  settle guard tau <= 0.25*t_end.  Thin plasma; the FLOAT limit
#                  binds.  See its note: the true worst row of the year was
#                  excluded by the guard, and the substitution is disclosed.
# Both sit at DIFFERENT binding constraints and at chi = 200 vs 386 against the
# anchor's 149 -- which is what makes them an independent test of the (1+chi)
# law form and of the gamma_CL calibration rather than two copies of one test.
scenarios:
- name: A_day_p95
  plasma:
    n0: 2137820000000.0
    Te_K: 1528.54
    Ti_K: 1383.54
    ion_mass_me: 400.0
  cathode_offset: -300.0
  i_beam: 0.000646784
  drag_target_N: 6.13313e-08
  predicted:
    phi_body_V: 26.35033610139007
    f_beam_nN: 31.56929172836865
    exhaust_ke_eV: 220.56600749690193
    binding: gamma_cl
  provenance:
    orbit_case: orbit_sims/validation_cases/400km_station_keeping_chipsat/results/station_keeping.csv
    csv_sha256: 5500c9e41ba0ddbdad527465f2fb50b46504bfd9b873fabe2558810fcfab7868
    timestamp_utc: '2024-04-19T23:10:00+00:00'
    row_index: 31526
