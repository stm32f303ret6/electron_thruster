# ----------------------------------------------------------------------
# collector.thermal -- sphere at 0 V (= plasma potential)
#
# The one probe problem with an EXACT closed-form answer and no sheath
# model: an absorber at plasma potential creates no field, orbits are
# straight lines, and the collected current of each species is the
# one-sided thermal flux times the sphere area:
#     I_th = n0 * e * <v>/4 * 4*pi*a^2       (ANY convex probe size)
#     I_th_e = 0.10393 uA, I_th_i = 4.379 nA, I_e/I_i = 23.74
#
# Plasma, cell size (0.15 mm), and ppc are the chipsat capstone
# values the chipsat case uses -- passing gates here validates that
# configuration (13.1 cells per Debye length), not just the code.
#
# This file holds ONLY the effective physics/numerics (frozen + hashed per
# run).  Gates live in acceptance.yaml.  PyYAML 1.1: decimal point AND
# signed exponent; helpers.py coerces every numeric leaf regardless.
# ----------------------------------------------------------------------
stage_id: collector.thermal

probe:
  radius: 7.5e-4         # [m] sphere radius: a/lambda_De = 0.38, 5 cells
  bias: 0.0              # [V] at plasma potential -> exact thermal collection

plasma:                  # capstone "PLASMA_MAX" row -- IDENTICAL to the chipsat deck
  n0: 1.627e12           # [m^-3] ambient density (electrons = ions)
  Te_K: 1318.8           # [K] electron temperature (kTe = 113.6 meV)
  Ti_K: 936.2            # [K] ion temperature
  ion_mass_me: 400.0     # [-] chipsat's reduced ion mass (NOT real O+)

geometry:                # lambda_De = 1.965 mm
  r_max: 12.0e-3         # [m] 6.1 lambda_De (no sheath to contain at 0 V)
  z_half: 12.0e-3        # [m] domain z in [-z_half, +z_half]
  n_r: 80                # dx = 0.15 mm = chipsat capstone cell size
  n_z: 160

numerics:
  time_step: 6.0e-11     # [s] CFL ~0.28 for 5*vth_e tail; wpe*dt = 4.3e-3
  max_steps: 50000       # 3.0 us: electron current on the electron clock (~0.06 us),
                         # ion current fills in on the ion transit clock (~2 us)
  ppc: 16                # chipsat capstone value (bulk, per species)
  random_seed: 42

diagnostics:
  field_period: 1250     # 40 field frames
  scrape_period: 500     # 100 collected-current samples
  reduced_period: 500    # ParticleNumber heartbeat at the scrape cadence
  steady_window_frac: 0.4   # average over the last 40% (1.8-3.0 us)

compute:
  gpu_arena_bytes: 2000000000
