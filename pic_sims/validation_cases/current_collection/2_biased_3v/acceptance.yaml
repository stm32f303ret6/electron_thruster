# ----------------------------------------------------------------------
# Acceptance policy for collector.biased_3v (sphere at +3 V).
#
# This is a NUMERICAL-SANITY policy, not an exact analytic verification:
# OML is an UPPER bound approached only as a/lambda_De -> 0.  At
# a/lambda_De = 0.38 the electron_contactor OML study measured ~93% of the
# ceiling, so the electron-current gate is a band [0.85, 1.05] -- above 1
# beyond noise would signal an injection bug, well below 0.85 a resolution
# or containment problem.  Ions are Boltzmann-repelled and NOT gated (their
# start-up trickle decays on the slow ion clock; see README).
#
# Changing any tolerance requires a new policy_id; every verdict records
# this file's SHA-256.
# ----------------------------------------------------------------------
schema_version: 1
policy_id: collector.biased_3v.v1
stage_id: collector.biased_3v
evidence_kind: numerical_sanity

gates:
  # I_e vs the OML ceiling (a/lambda_De = 0.38 -> ~93% expected).
  - id: electron_current_vs_oml
    required: true
    metric: electron_current_over_oml
    comparison: within_range
    minimum: 0.85
    maximum: 1.05

  # Far-shell density == n0 (flux reservoir intact).
  - id: far_density_matches_n0
    required: true
    metric: far_density_e_over_n0
    comparison: abs_within
    target: 1.0
    tolerance: 0.05

  # Far-shell quasineutrality.
  - id: far_field_quasineutral
    required: true
    metric: quasineutrality
    comparison: at_most
    maximum: 0.02

  # Sheath must not touch the open boundaries.
  - id: sheath_contained
    required: true
    metric: edge_phi_max_V
    comparison: at_most
    maximum: 0.5
