# ----------------------------------------------------------------------
# emitter.negative_cathode -- physics/numerics config (two-plate RZ diode)
#
# A -100 V full-width cathode on the LEFT boundary (z = -2 mm) emits a
# 10 uA electron beam toward a grounded collector on the RIGHT boundary
# (z = +2 mm).  Electrostatic, axisymmetric (RZ), self-consistent space
# charge.  The emitted current is prescribed (no thermionic model).
#
# This file holds ONLY the effective physics/numerics of a run: it is
# frozen verbatim into every run's config_used.yaml and hashed into the
# run ID.  Acceptance tolerances live in acceptance.yaml; presentation
# settings live in animate.py.  Nothing here selects an output path.
#
# NOTE on floats: PyYAML implements YAML 1.1 -- write floats with a
# decimal point AND a signed exponent (5.0e-4, not 5e-4).  helpers.py
# coerces every numeric leaf anyway, so the frozen config is type-stable.
# ----------------------------------------------------------------------
stage_id: emitter.negative_cathode

geometry:
  r_max: 2.0e-3          # radial extent [m]
  z_min: -2.0e-3         # left boundary  [m] -- the cathode plane
  z_max: 2.0e-3          # right boundary [m] -- the collector plane
  n_r: 40                # radial cells  (dr = 0.05 mm)
  n_z: 80                # axial cells   (dz = 0.05 mm)

electrodes:
  v_cathode: -100.0      # left  (z_min) Dirichlet boundary [V] -- the emitting plate
  v_collector: 0.0       # right (z_max) Dirichlet boundary [V]

emission:                # disc source one cell inside the cathode, firing +z
  radius: 5.0e-4         # source spot r < radius [m] (10 radial cells)
  current: 1.0e-5        # emitted beam current [A]
  u_th: 7.0e-4           # cold launch: normalized rms momentum (gamma*beta)

numerics:
  time_step: 1.5e-12     # [s]  (v_max*dt ~ 0.18 dz)
  max_steps: 4000        # 6.0 ns total
  beam_ppc: 128          # emission macroparticles per source cell per step
  random_seed: 42

diagnostics:
  field_period: 80       # phi/rho + particle dumps every N steps (50 frames)
  reduced_period: 80     # ParticleNumber / ParticleEnergy at the scrape cadence
  scrape_period: 80      # boundary-scraping dump cadence
  ke_max_ev: 120.0       # energy-axis ceiling for plots [eV]

compute:
  # AMReX pre-allocates ~3/4 of TOTAL GPU memory by default; cap the arena so
  # this small deck coexists with other GPU users (it peaks well under 1 GB).
  gpu_arena_bytes: 1000000000
