# ----------------------------------------------------------------------
# characterization.350V_400km -- physics/numerics config (350 V)
#
# The SAME physical system as capstone.floating_body (the 200 V anchor)
# -- identical can geometry, plasma row, grid, and charge pump -- driven at
# 350 V, one step past the previously tested 300 V ceiling, with the beam
# current scaled to the same emission-ceiling ratio every committed run
# demonstrated:
#
#   I_CL(350 V, 4.7 mm gap, 0.5 mm spot) = 0.543 mA
#   I/I_CL = 1.46 (the measured float200 ratio)  ->  i_beam = 0.793 mA
#
# THE QUESTION: the model's 400 km axial row demands V_min = 304 V, just
# above the tested envelope.  Does the envelope extend?  Pre-registered
# predictions from the committed laws (see README.md):
#   - thrust: F ~ 40.5 nN (frontier F ~ V^2 at fixed I/I_CL), covering the
#     400 km axial mean drag of 32.9 nN at ~81 % duty;
#   - float: the fitted collection law puts phi ~ 47 V -- inside, but only
#     just, the 50 V benign design limit.  Whether the float stays benign
#     at the 400 km-enabling drive IS the question this run answers.
#
# This file holds ONLY the effective physics/numerics (frozen + hashed per
# run).  Gates live in acceptance.yaml.
#
# PyYAML 1.1: decimal point AND signed exponent; helpers.py coerces every
# numeric leaf regardless.
# ----------------------------------------------------------------------
stage_id: characterization.350V_400km

electrical:
  cathode_offset: -350.0   # [V] one step past the 300 V tested ceiling: cathode
                           #     relative to the floating body.  Always negative.
  phi_body_init: 0.0       # [V] initial floating-body potential (pump start).
  t_supply: 100.0e-9       # [s] supply switch-on; before this, body and cathode are
                           #     equipotential and the can settles like a bare probe.

beam:
  i_beam: 0.793e-3         # [A] emitted beam current: I_CL(350 V) * 1.46, the same
                           #     emission-ceiling ratio the float200 run measured.
  t_on: 150.0e-9           # [s] gun switch-on; must be >= t_supply.
  rms_velocity: 2.6e5      # [m/s] per-axis thermal spread of the emitted beam
                           #     (~0.39 eV/axis; hotter than the emitter rungs' 0.25 eV
                           #     -- see VALIDATION_GAPS.md G3).
  flux_correction: 1.0     # [-] RZ over-emission divisor; z-normal planar flux
                           #     calibrates to ~1.0 (measured 1.007 for this deck).

geometry:                  # all lengths [m]; IDENTICAL to the anchor/high_thrust.
  r_probe: 5.0e-3          # can outer radius.
  wall_thickness: 0.4e-3
  lid_thickness: 0.4e-3
  floor_thickness: 0.4e-3
  z_bot: -5.0e-3           # can floor bottom (also the cathode-disk bottom).
  z_top: 0.5e-3            # lid top (capstone short-drift geometry).
  r_slit: 2.0e-3           # lid exhaust-hole radius -- the escape lever.
  r_cathode: 1.5e-3        # cathode-disk radius (the emitting electrode).
  emit_radius: 0.5e-3      # emission-spot radius; < r_cathode and < r_slit.

plasma:                    # capstone "PLASMA_MAX" row -- IDENTICAL to collector.*.
  n0: 1.627e12             # [m^-3]
  Te_K: 1318.8             # [K]  (kTe = 113.6 meV)
  Ti_K: 936.2              # [K]
  ion_mass_me: 400.0       # [-] reduced ion mass (NOT real O+; ladder-wide caveat).

reservoir:                 # infinite-ionosphere recycle.  REQUIRED for the floating
                           # equilibrium (a current balance); without refill the run
                           # measures reservoir depletion, not physics.
  enabled: true
  frac: 0.7                # recycle into the outer (1-frac) radial shell.
  every: 25                # inject the banked weight every N steps.

domain:
  rmax: 0.030              # [m] outer radial extent (must contain sheath + plume).
  aspect: 1.12             # [-] Lz/rmax of the squat domain.
  zmargin_lo: 25.0e-3      # [m] min plasma margin below the can floor.
  zmargin_hi: 35.0e-3      # [m] min margin above the lid (the +z exhaust plume must
                           #     reach phi~0 so a z_hi crossing is a genuine escape).
  edge_phi_max: 1.0        # [V] live sheath-containment watchdog threshold (warn);
                           #     the same bound is GATED in analysis from field dumps.

numerics:
  dx: 0.15e-3              # [m] cell size (dr = dz) -- chipsat capstone/collector value.
  dt: null                 # [s] null -> CFL-derived: 0.3*dx/(v_beam + 4*vth_e).
  ppc: 16                  # ambient macroparticles per cell per species.
  ppc_beam: 16             # beam macroparticles per surface cell per step
                           #     (emitter rungs used 128 -- VALIDATION_GAPS.md G3).

run:
  t_end: 800.0e-9          # [s] simulated end time (overrides max_steps if fewer).
  max_steps: 220000        # [-] hard step cap.  The 350 V beam is faster, so the
                           #     CFL dt shrinks to ~3.86 ps and 800 ns needs ~207k
                           #     steps (300 V needed ~193k, 200 V ~159k).
  diag_period_frac: 40     # openPMD field/particle/scrape dumps: ~this many per run.
  phi_ceiling: 100.0       # [V] choke detector: sustained phi_body above this aborts
                           #     the run as FAILED (the ionosphere cannot neutralize).
  choke_sustain: 50.0e-9   # [s] how long above the ceiling before calling it.

compute:
  # AMReX pre-allocates ~3/4 of TOTAL GPU memory by default; cap the arena.
  # This deck peaks around ~3-4 GB (3M+ ambient macroparticles + 200x440 grid).
  gpu_arena_bytes: 6000000000
